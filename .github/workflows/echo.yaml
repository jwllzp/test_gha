name: Build Docker

on:
  workflow_dispatch:
    inputs:
      docker_dir:
        description: "Directory containing the Dockerfile"
        required: true
        default: "."

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Pretend build
        run: echo "Building docker image from ${{ inputs.docker_dir }} on branch ${{ github.ref_name }}"
