name: Build Docker

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        required: true
        default: "main"
      docker_dir:
        description: "Directory containing the Dockerfile"
        required: true
        default: "."

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1
          sparse-checkout: ${{ github.event.inputs.docker_dir }}

      - name: Pretend to build image
        run: echo "Building docker image from ${{ github.event.inputs.docker_dir }} on branch ${{ github.event.inputs.branch }}"
